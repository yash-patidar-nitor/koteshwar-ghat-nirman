<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>कोटेश्वर नर्मदा घाट निर्माण – दान डैशबोर्ड</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1H+6N0VQ4K/2Jz4vYjK3nY6V+8G5Z4a1r5Ue9F6bJw" crossorigin="anonymous">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { margin-bottom: 1rem; }
        .chart-container { position: relative; height: 300px; }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4 text-center">कोटेश्वर नर्मदा घाट निर्माण – दान डैशबोर्ड</h1>
    <div class="row" id="summary-cards">
        <!-- Cards will be injected by JS -->
    </div>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="chart-container">
                <canvas id="donationChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <h4 class="mb-3">गांववार संग्रह / घोषण राशि</h4>
            <table class="table table-striped" id="village-table">
                <thead class="table-dark">
                <tr>
                    <th>गांव</th>
                    <th>राशि (₹)</th>
                </tr>
                </thead>
                <tbody>
                <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Utility for Hindi number formatting
    const fmt = new Intl.NumberFormat('hi-IN');

    fetch('/api/summary')
        .then(r => r.json())
        .then(data => {
            // Populate summary cards
            const cards = [
                {title: 'अनुमानित खर्च', value: fmt.format(data.projected_spending)},
                {title: 'कुल घोषित राशि', value: fmt.format(data.total_announced)},
                {title: 'कुल प्राप्त राशि', value: fmt.format(data.total_received)},
                {title: 'कुल खर्चed राशि', value: fmt.format(data.total_spent)}
            ];
            const cardsContainer = document.getElementById('summary-cards');
            cards.forEach(c => {
                const col = document.createElement('div');
                col.className = 'col-md-3';
                col.innerHTML = `
                    <div class="card text-center shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">${c.title}</h5>
                            <p class="card-text fs-4">₹ ${c.value}</p>
                        </div>
                    </div>`;
                cardsContainer.appendChild(col);
            });

            // Populate village table
            const tbody = document.querySelector('#village-table tbody');
            data.donations.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${d.village}</td><td>${fmt.format(d.amount)}</td>`;
                tbody.appendChild(tr);
            });

            // Doughnut chart for donations per village
            const ctx = document.getElementById('donationChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.donations.map(d => d.village),
                    datasets: [{
                        data: data.donations.map(d => d.amount),
                        backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b']
                    }]
                },
                options: {
                    plugins: { legend: { position: 'bottom' } },
                    maintainAspectRatio: false
                }
            });
        })
        .catch(err => console.error('Summary fetch error', err));
</script>
</body>
</html>
